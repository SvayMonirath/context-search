[package]
name = "vault-pii"
version = "0.1.0"
edition = "2021"
description = "Deterministic local PII scrubbing engine for Context Vault"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

