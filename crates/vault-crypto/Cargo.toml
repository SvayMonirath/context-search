[package]
name = "vault-crypto"
version = "0.1.0"
edition = "2021"
description = "Zero-knowledge encryption and key derivation engine for Context Vault"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
